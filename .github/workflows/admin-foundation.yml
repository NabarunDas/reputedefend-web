name: Marketing and admin checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:admin
      - run: npm run build:admin
      - run: npm run typecheck:admin
      - run: npm run smoke:admin
