<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium emerald-green atmospheric background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a3d2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a6e3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#085330;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="mistGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#c5e8b4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0a6e3c;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradient)"/>
  
  <!-- Atmospheric glow effects -->
  <circle cx="200" cy="150" r="300" fill="url(#mistGlow)" opacity="0.3"/>
  <circle cx="1000" cy="500" r="400" fill="url(#mistGlow)" opacity="0.2"/>
  
  <!-- Floating AI Console placeholder -->
  <g transform="translate(300, 150)">
    <!-- Glass effect console -->
    <rect x="0" y="0" width="600" height="400" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#c5e8b4" stroke-width="2"/>
    <rect x="20" y="20" width="560" height="60" rx="10" fill="#0a6e3c" fill-opacity="0.3"/>
    <text x="300" y="58" font-family="system-ui" font-size="20" font-weight="600" fill="#f7f8f3" text-anchor="middle">
      AI Call Dashboard
    </text>
    
    <!-- Console content indicators -->
    <rect x="40" y="100" width="520" height="40" rx="8" fill="#c5e8b4" fill-opacity="0.15"/>
    <rect x="40" y="160" width="520" height="40" rx="8" fill="#c5e8b4" fill-opacity="0.12"/>
    <rect x="40" y="220" width="520" height="40" rx="8" fill="#c5e8b4" fill-opacity="0.1"/>
    
    <!-- Glowing accent -->
    <circle cx="560" cy="40" r="8" fill="#c5e8b4" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <text x="600" y="640" font-family="system-ui" font-size="14" fill="#c5e8b4" text-anchor="middle" opacity="0.6">
    Placeholder: Awaiting approved cinematic console artwork
  </text>
</svg>