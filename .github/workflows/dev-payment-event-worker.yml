name: DEV payment event worker

on:
  push:
    branches: [main]
    paths: [".github/workflows/dev-payment-event-worker.yml"]
  schedule:
    # GitHub runs this only from the default branch, which is main.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-payment-event-worker
  cancel-in-progress: false

jobs:
  reconcile:
    # A schedule event always reports the default branch. A manual run is
    # accepted from develop or main. The request below still refuses every
    # host except the develop Admin preview.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_ORIGIN: ${{ secrets.DEV_ADMIN_PREVIEW_URL }}
      WORKER_SECRET: ${{ secrets.DEV_PAYMENT_EVENT_WORKER_SECRET }}
      BYPASS: ${{ secrets.DEV_VERCEL_AUTOMATION_BYPASS }}
    steps:
      - name: Reconcile signed DEV payment events
        shell: bash
        run: |
          set -euo pipefail
          : "${PREVIEW_ORIGIN:?Missing DEV_ADMIN_PREVIEW_URL repository secret}"
          : "${WORKER_SECRET:?Missing DEV_PAYMENT_EVENT_WORKER_SECRET repository secret}"
          : "${BYPASS:?Missing DEV_VERCEL_AUTOMATION_BYPASS repository secret}"
          python3 - <<'PY'
          import os, re, sys
          origin = os.environ["PREVIEW_ORIGIN"]
          secret = os.environ["WORKER_SECRET"]
          bypass = os.environ["BYPASS"]
          if not re.fullmatch(r"https://profilerelaunch-admin-git-develop-[a-z0-9-]+\.vercel\.app", origin):
              sys.exit("DEV_ADMIN_PREVIEW_URL must be the https develop Admin origin, with no path or query")
          unsafe = re.compile(r"[\s$`\"'\\]")
          if len(secret) < 32 or unsafe.search(secret):
              sys.exit("DEV_PAYMENT_EVENT_WORKER_SECRET must be one line of at least 32 characters")
          if not bypass or unsafe.search(bypass):
              sys.exit("DEV_VERCEL_AUTOMATION_BYPASS must be one line")
          PY
          path="/api/internal/jobs/dev-payment-events"
          # A protection redirect must stay 302 or 401. Do not follow it, and do not forward the bearer.
          unauth="$(curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' "${PREVIEW_ORIGIN}${path}")"
          echo "unauthenticated develop preview -> HTTP ${unauth}"
          if [ "$unauth" != "302" ] && [ "$unauth" != "401" ]; then
            echo "Deployment protection did not intercept the unauthenticated request"
            exit 1
          fi
          # Use an intentionally invalid application bearer to distinguish
          # Vercel Deployment Protection from ProfileRelaunch authentication.
          # This probe cannot run the worker, change payments, or disclose secrets.
          probe_body="$(mktemp)"
          probe_code="$(curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 20 --output "$probe_body" --write-out '%{http_code}' \
            --header "Authorization: Bearer invalid-diagnostic-probe" \
            --header "x-vercel-protection-bypass: ${BYPASS}" \
            "${PREVIEW_ORIGIN}${path}")"
          probe_result="$(python3 - "$probe_body" "$probe_code" <<'PY'
          import json, sys
          path, code = sys.argv[1:]
          try:
              payload = json.load(open(path, encoding="utf-8"))
          except (OSError, ValueError, UnicodeError):
              payload = {}
          if code == "401" and payload.get("status") == "unauthorized":
              print("application_auth_reached")
          elif code == "403" and payload.get("status") == "disabled":
              print("application_worker_disabled")
          elif code == "503" and payload.get("status") == "disabled":
              print("application_worker_configuration_missing")
          elif code in ("401", "302", "307", "308"):
              print("deployment_protection_or_gateway_rejected")
          elif code == "200":
              print("unsafe_invalid_bearer_accepted")
          else:
              print("unexpected_probe_response")
          PY
          )"
          rm -f "$probe_body"
          echo "safe authentication probe: ${probe_result}"
          if [ "$probe_result" != "application_auth_reached" ]; then
            echo "DEV worker preflight did not reach the expected application authentication boundary"
            exit 1
          fi
          body="$(mktemp)"
          code="$(curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 60 --output "$body" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${WORKER_SECRET}" \
            --header "x-vercel-protection-bypass: ${BYPASS}" \
            "${PREVIEW_ORIGIN}${path}")"
          echo "worker -> HTTP ${code}"
          python3 - "$body" "$code" <<'PY'
          import json, sys
          body, code = sys.argv[1], sys.argv[2]
          if code != "200":
              sys.exit("worker route did not accept the scheduled call")
          payload = json.load(open(body, encoding="utf-8"))
          if payload.get("status") != "success":
              sys.exit("worker did not report success")
          allowed = {"status", "claimed", "succeeded", "retried", "deadLettered", "released", "skipped", "confirmationSent"}
          extra = set(payload) - allowed
          if extra:
              sys.exit("worker response included unexpected fields")
          print("claimed", payload.get("claimed"), "succeeded", payload.get("succeeded"), "confirmationSent", payload.get("confirmationSent"))
          PY
          rm -f "$body"
