name: Marketing, admin and customer checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL and PostgREST for the intake mail claim test
        run: |
          # The default runner resolver has failed to resolve the Ubuntu archive
          # hosts before any test starts. Point the job at public resolvers, then
          # install the same packages. This does not skip a test.
          sudo systemctl stop systemd-resolved || true
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
          getent hosts archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com
          sudo apt-get update
          sudo apt-get install -y postgresql poppler-utils
          curl -fsSL -o /tmp/postgrest.tar.xz https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz
          sudo tar -xJf /tmp/postgrest.tar.xz -C /usr/local/bin
          postgrest --version
          find /usr/lib/postgresql -name initdb
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke:marketing
      - run: npm run test:pay-env-05
      - run: npm run typecheck:pay-env-05
      - run: npm run test:admin
      - run: npm run build:admin
      - run: npm run typecheck:admin
      - run: npm run smoke:admin
      - run: npm run test:customer
      - run: npm run build:customer
      - run: npm run typecheck:customer
      - run: npm run smoke:customer
      - run: npm run test:telloya
      - run: npm run build:telloya
      - run: npm run typecheck:telloya
      - run: npm run smoke:telloya
