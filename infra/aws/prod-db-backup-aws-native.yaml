AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ProfileRelaunch AWS-native production database backup scheduler. Uses EventBridge Scheduler
  to start CodeBuild every three hours. CodeBuild fetches one approved commit, verifies the
  runner and CLI lock checksums, reads the production Supabase Session Pooler URL from
  Secrets Manager, and writes verified logical backups into the existing production backup
  S3 bucket. A branch name is not an execution source.

Parameters:
  BackupBucketName:
    Type: String
    Default: profilerelaunch-prod-db-backups-euw2-20261005
    Description: Existing production database backup bucket.

  ProdSupabaseDbUrlSecretArn:
    Type: String
    Description: >
      ARN of the AWS Secrets Manager secret containing the full production Supabase Session
      Pooler connection string.

  RepositoryCloneUrl:
    Type: String
    Default: https://github.com/NabarunDas/reputedefend-web.git
    Description: Public repository URL. Used only to fetch ApprovedRunnerCommit.

  ApprovedRunnerCommit:
    Type: String
    AllowedPattern: "^[0-9a-f]{40}$"
    MinLength: 40
    MaxLength: 40
    Description: >
      Full lowercase commit SHA of the reviewed backup runner. Update this only when the
      runner itself is approved. Do not set a branch name.

  ApprovedRunnerScriptSha256:
    Type: String
    Default: "d2114b21d11c5f3ac52f8d8b1369cc9aaee0bcdcdc79c05a9fd5db8ef289fa3d"
    AllowedPattern: "^[0-9a-f]{64}$"
    MinLength: 64
    MaxLength: 64
    Description: >
      SHA-256 of scripts/prod-db-backup-aws.sh at ApprovedRunnerCommit. The build fails
      closed when the fetched file does not match.

  ApprovedBackupCliLockSha256:
    Type: String
    Default: "49e0391e0cff428d9487e09001092297ed8c9edb2c63bde4539da9499b382e14"
    AllowedPattern: "^[0-9a-f]{64}$"
    MinLength: 64
    MaxLength: 64
    Description: >
      SHA-256 of infra/aws/backup-cli/package-lock.json at ApprovedRunnerCommit. The build
      fails closed when the fetched lockfile does not match.

  ApprovedMigrationHead:
    Type: String
    Default: "20261004223358_data_api_default_privileges_hardening_v1"
    AllowedPattern: "^[0-9]{14}_[a-z0-9_]+$"
    Description: >
      Migration id (filename without .sql) the live database head must match. Update this
      when a reviewed migration is applied. It is independent of ApprovedRunnerCommit.

  ScheduleExpression:
    Type: String
    Default: rate(3 hours)

  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues:
      - ENABLED
      - DISABLED

Resources:
  BackupBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/codebuild/ProfileRelaunchProdDbBackupAwsNative
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: ProfileRelaunch
        - Key: Environment
          Value: production

  BackupCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ProfileRelaunchProdDbBackupCodeBuild
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProfileRelaunchProdDbBackup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadBackupBucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${BackupBucketName}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - completed/*
                      - backups/*
              - Sid: ReadWriteBackupObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${BackupBucketName}/backups/*"
                  - !Sub "arn:aws:s3:::${BackupBucketName}/completed/*"
              - Sid: ReadProductionDatabaseSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref ProdSupabaseDbUrlSecretArn
              - Sid: WriteBackupBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/ProfileRelaunchProdDbBackupAwsNative:*"
      Tags:
        - Key: Application
          Value: ProfileRelaunch
        - Key: Environment
          Value: production

  BackupBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ProfileRelaunchProdDbBackupAwsNative
      Description: ProfileRelaunch production logical database backup
      ServiceRole: !GetAtt BackupCodeBuildRole.Arn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 30
      QueuedTimeoutInMinutes: 15
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - node --version
                - npm --version
                - docker --version
                - aws --version
                - git --version
                - python3 --version
                - jq --version
            pre_build:
              commands:
                # Decoded bytes are scripts/prod-db-backup-verify-source.sh. The build
                # fails closed before any repository script runs.
                - python3 -c "import base64,pathlib; pathlib.Path('/tmp/prod-db-backup-verify-source.sh').write_bytes(base64.b64decode(''))"
                - bash /tmp/prod-db-backup-verify-source.sh
            build:
              commands:
                - cd repo && bash scripts/prod-db-backup-aws.sh
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        # PrivilegedMode stays on. The proven dump path runs postgres:17-alpine for the
        # migration-head query and the Supabase CLI runs pg_dump inside a container.
        # CodeBuild's standard image only starts that Docker daemon in privileged mode.
        # Turning it off would change the backup output path. See the backup runbook.
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: SUPABASE_DB_URL
            Type: SECRETS_MANAGER
            Value: !Ref ProdSupabaseDbUrlSecretArn
          - Name: AWS_BACKUP_BUCKET
            Type: PLAINTEXT
            Value: !Ref BackupBucketName
          - Name: REPOSITORY_CLONE_URL
            Type: PLAINTEXT
            Value: !Ref RepositoryCloneUrl
          - Name: APPROVED_RUNNER_COMMIT
            Type: PLAINTEXT
            Value: !Ref ApprovedRunnerCommit
          - Name: APPROVED_RUNNER_SCRIPT_SHA256
            Type: PLAINTEXT
            Value: !Ref ApprovedRunnerScriptSha256
          - Name: APPROVED_BACKUP_CLI_LOCK_SHA256
            Type: PLAINTEXT
            Value: !Ref ApprovedBackupCliLockSha256
          - Name: APPROVED_MIGRATION_HEAD
            Type: PLAINTEXT
            Value: !Ref ApprovedMigrationHead
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BackupBuildLogGroup
          StreamName: production-db-backup
      Visibility: PRIVATE
      Tags:
        - Key: Application
          Value: ProfileRelaunch
        - Key: Environment
          Value: production

  BackupSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ProfileRelaunchProdDbBackupScheduler
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartProductionDatabaseBackup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                Resource: !GetAtt BackupBuildProject.Arn
      Tags:
        - Key: Application
          Value: ProfileRelaunch
        - Key: Environment
          Value: production

  BackupSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: profilerelaunch-prod-db-backup-3h
      Description: Start the ProfileRelaunch production DB backup every three hours.
      ScheduleExpression: !Ref ScheduleExpression
      State: !Ref ScheduleState
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt BackupBuildProject.Arn
        RoleArn: !GetAtt BackupSchedulerRole.Arn
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3

Outputs:
  BackupBuildProjectName:
    Value: !Ref BackupBuildProject
    Description: CodeBuild project to use for a manual backup validation.

  BackupBuildProjectArn:
    Value: !GetAtt BackupBuildProject.Arn

  BackupScheduleName:
    Value: !Ref BackupSchedule

  BackupScheduleArn:
    Value: !GetAtt BackupSchedule.Arn

  BackupBucketName:
    Value: !Ref BackupBucketName

  ProdSupabaseDbUrlSecretArn:
    Value: !Ref ProdSupabaseDbUrlSecretArn

  ApprovedRunnerCommit:
    Value: !Ref ApprovedRunnerCommit

  ApprovedMigrationHead:
    Value: !Ref ApprovedMigrationHead
