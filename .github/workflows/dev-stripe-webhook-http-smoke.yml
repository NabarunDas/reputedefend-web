name: DEV Stripe webhook HTTP smoke

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-stripe-webhook-http-smoke.yml

permissions:
  contents: read

jobs:
  webhook-protection:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify unauthenticated DEV Admin custom hostname remains protected
        shell: bash
        run: |
          set -euo pipefail
          host='https://dev-hooks.profilerelaunch.com'
          getent ahostsv4 dev-hooks.profilerelaunch.com | awk '{print $1}' | sort -u | head -4
          check() {
            local method="$1" path="$2" code target
            local headers
            headers="$(mktemp)"
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' --request "$method" "$host$path")"
            target="$(python3 - "$headers" <<'PY'
          import sys
          from urllib.parse import urlsplit
          for line in open(sys.argv[1], encoding='utf-8', errors='ignore'):
              if line.lower().startswith('location:'):
                  value = urlsplit(line.split(':',1)[1].strip())
                  print(value.hostname or '', value.path)
                  break
          PY
          )"
            rm -f "$headers"
            echo "$method $path -> HTTP $code; redirect target host/path: $target"
            test "$code" = "302"
            test "$target" = "vercel.com /sso-api"
          }
          # Without the separate Vercel automation-bypass query token in the
          # Stripe sandbox endpoint configuration, SSO must intercept every route.
          # This DOES NOT test the bypass-protected Stripe delivery; signed
          # Stripe event IDs are separately verified in DEV receipt records.
          check GET /
          check GET /login
          check GET /brand/profile-relaunch-logo.png
          check POST /auth/send
          check POST /api/webhooks/resend
          check POST /api/webhooks/stripe
